apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: auctionhub-ingress

spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auctionhub-service
                port:
                  number: 80